## options_source per-topic override. Defaults (no entry):
##   default topic     -> authored  (scripted intro)
##   every other topic -> ai_suggested
## Override either direction here when needed; no entries means the new
## default behaviour applies.

options:
  default:
    - { label: "Hello, friend.",                       topic_id: greeting }
    - { label: "What did you see at the tower?",       topic_id: the_tower }
    - { label: "How are you, Orren?",                  topic_id: personal_history }
    - { label: "Goodbye.",                             topic_id: __close }
  the_tower:
    - { label: "You saw something, didn't you?",       topic_id: the_tower, verb: press, press_angle: angle_saw_something }
    - { label: "You're afraid of the wings.",          topic_id: the_tower, verb: press, press_angle: angle_wings }
    - { label: "I won't tell the reeve.",              topic_id: the_tower, verb: press, press_angle: angle_safe_to_share }
    - { label: "Forget I asked.",                      topic_id: greeting }
  personal_history:
    - { label: "Where did you come from?",             topic_id: personal_history }
    - { label: "What did you used to do?",             topic_id: personal_history }
    - { label: "Forget I asked.",                      topic_id: greeting }
    - { label: "Goodbye.",                             topic_id: __close }
  greeting:
    - { label: "What did you see at the tower?",       topic_id: the_tower }
    - { label: "How are you, Orren?",                  topic_id: personal_history }
    - { label: "Goodbye.",                             topic_id: __close }
  # Post-reveal option set. Surfaced by default_options_by_state when
  # flags.cracked is true. The player has earned the secret; this is the
  # short coda. "Tell Halden yourself" is a refusal beat (he won't),
  # not a quest branch — the player still carries the news.
  cracked:
    - { label: "Are you all right?",                   topic_id: personal_history }
    - { label: "Tell Halden yourself.",                topic_id: the_tower }
    - { label: "Thank you, Orren.",                    topic_id: gratitude }
    - { label: "Goodbye.",                             topic_id: __close }
  gratitude:
    - { label: "Goodbye.",                             topic_id: __close }

# Force the post-reveal options bank to authored — the player needs the
# scripted three-beat closure, not AI-generated replies that might wander
# off and re-open the topic.
options_source:
  cracked:    authored
  gratitude:  authored
